<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Platinum keeps a college counselor's students, tasks, college lists, meetings and files in one workspace, and drafts the follow-up after each meeting. Nothing reaches a family until the counselor approves it." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PRODUCT_NAME%: a workspace for private college counselors" />
    <meta property="og:description" content="Your whole caseload in one workspace. The follow-up, already drafted. Nothing reaches a family until you approve it." />
    <meta property="og:image" content="/brand/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A page of handwritten meeting notes beside the words: The follow-up, already drafted." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme before the first paint, so a dark screen never flashes light. src/theme.ts takes over once the app starts; the storage key is the same. -->
    <script>
      try {
        var saved = localStorage.getItem('appearance')
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="%FAVICON%" />
    <title>%PRODUCT_NAME%: a workspace for private college counselors</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
